<div class="shell">

  <aside class="brand">
    <div class="bx-lockup bx-lockup--lg">
      <img class="bx-mark" src="assets/brand/buxmap-mark.svg" alt="" />
      <img class="bx-name" src="assets/brand/buxmap-nombre.svg" alt="Buxmap" />
    </div>

    <!-- Un mapa de rutas esquemático con un bus recorriéndolo: lo mismo que la
         app muestra por dentro. SVG puro, no depende del mapa ni de la red.
         Las paradas están sobre los vértices de cada línea, no al azar. -->
    <svg class="routes" viewBox="0 0 600 400" preserveAspectRatio="xMidYMid meet" aria-hidden="true">
      <path class="rt rt-b" d="M330 -400 L330 260 L240 350 L-900 350" />
      <path class="rt rt-a" d="M-900 60 L120 60 L240 180 L420 180 L520 280 L1500 280" />
      <path class="rt rt-live" d="M-900 60 L120 60 L240 180 L420 180 L520 280 L1500 280" />
      <circle class="stop sb" cx="330" cy="70" r="6" />
      <circle class="stop sb" cx="285" cy="305" r="6" />
      <circle class="stop sb" cx="120" cy="350" r="6" />
      <circle class="stop sa" cx="60" cy="60" r="6" />
      <circle class="stop sa" cx="180" cy="120" r="6" />
      <circle class="stop sa" cx="470" cy="230" r="6" />
      <circle class="stop sx" cx="330" cy="180" r="9" />
      <circle class="bus" r="8" />
    </svg>

    <div class="pitch">
      <h1>Mirá dónde viene tu bus, <em>en vivo</em>.</h1>
      <ul>
        <li><ion-icon name="navigate" aria-hidden="true"></ion-icon>Buses moviéndose en el mapa en tiempo real</li>
        <li><ion-icon name="time" aria-hidden="true"></ion-icon>Tiempo estimado de llegada a tu parada</li>
        <li><ion-icon name="notifications" aria-hidden="true"></ion-icon>Avisos de atrasos, desvíos y cancelaciones</li>
      </ul>
    </div>
  </aside>

  <main class="main">
    <div class="col">
      <header class="top">
        <a *ngIf="back" class="back" [routerLink]="back" aria-label="Volver">
          <ion-icon name="chevron-back" aria-hidden="true"></ion-icon>
        </a>
        <div class="bx-lockup">
          <img class="bx-mark" src="assets/brand/buxmap-mark.svg" alt="" />
          <img class="bx-name" src="assets/brand/buxmap-nombre.svg" alt="Buxmap" />
        </div>
      </header>

      <ng-content></ng-content>
    </div>
  </main>

</div>
