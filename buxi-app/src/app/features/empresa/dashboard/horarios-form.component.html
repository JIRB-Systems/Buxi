<ion-header>
  <ion-toolbar>
    <ion-title>Horarios · {{ ruta.nombre }}</ion-title>
    <ion-buttons slot="end">
      <ion-button (click)="close()">Cerrar</ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content class="form-content" [scrollEvents]="true" (ionScroll)="onFormScroll()">
  <div class="hint-top">Agregá cada hora de salida tal cual sale el bus — no hace falta que sean parejas.</div>

  <div class="dia-card" *ngFor="let r of rows">
    <div class="dia-title">{{ r.label }}</div>

    <div class="chips" *ngIf="r.times.length">
      <span class="chip" *ngFor="let h of r.times">
        {{ formatHora(h.hora) }}
        <ion-icon name="close" (click)="removeTime(r, h)"></ion-icon>
      </span>
    </div>
    <div class="empty-hint" *ngIf="!r.times.length && !loading">Sin horas cargadas</div>

    <div class="add-row">
      <input type="time" class="time-input" [(ngModel)]="r.newTime" (wheel)="blurTarget($event)" />
      <ion-button class="add-btn" [disabled]="!r.newTime || r.adding" (click)="addTime(r)">
        <ion-icon name="add" slot="icon-only"></ion-icon>
      </ion-button>
    </div>
  </div>
</ion-content>

<ion-footer class="form-footer">
  <ion-toolbar>
    <ion-button class="submit-btn" expand="block" (click)="close()">Listo</ion-button>
  </ion-toolbar>
</ion-footer>
