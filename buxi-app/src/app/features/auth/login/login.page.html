<ion-content [fullscreen]="true" class="login-content" [scrollY]="true">
  <div class="login-wrapper">

    <div class="brand">
      <div class="brand-mark">
        <img src="assets/icon/buxi-logo-mark.png" alt="Buxi" />
      </div>
      <div class="wordmark">BUX<span class="accent-i">I</span></div>
      <p class="tagline">— Tus buses en <span>tiempo real</span> —</p>
    </div>

    <div class="welcome">
      <h2>¡Bienvenido a <span class="accent">Buxi</span>!</h2>
      <p>Inicia sesión para continuar</p>
    </div>

    <form [formGroup]="loginForm" (ngSubmit)="onLogin()" class="login-form">
      <div class="field" [class.has-error]="loginForm.get('email')?.touched && loginForm.get('email')?.invalid">
        <div class="input-wrap">
          <ion-icon name="mail-outline" class="field-icon"></ion-icon>
          <ion-input formControlName="email" type="email" placeholder="Correo electrónico"></ion-input>
        </div>
        <span class="err" *ngIf="loginForm.get('email')?.touched && loginForm.get('email')?.hasError('email')">Correo no válido</span>
      </div>

      <div class="field" [class.has-error]="loginForm.get('password')?.touched && loginForm.get('password')?.invalid">
        <div class="input-wrap">
          <ion-icon name="lock-closed-outline" class="field-icon"></ion-icon>
          <ion-input formControlName="password" [type]="showPassword ? 'text' : 'password'" placeholder="Contraseña"></ion-input>
          <ion-icon [name]="showPassword ? 'eye-off-outline' : 'eye-outline'" class="eye" (click)="togglePassword()"></ion-icon>
        </div>
        <span class="err" *ngIf="loginForm.get('password')?.touched && loginForm.get('password')?.hasError('minlength')">Mínimo 6 caracteres</span>
      </div>

      <div class="forgot-row">
        <a routerLink="/auth/forgot-password" class="forgot">¿Olvidaste tu contraseña?</a>
      </div>

      <ion-button expand="block" type="submit" class="btn-main" [disabled]="loginForm.invalid">
        <ion-icon name="log-in-outline" slot="start"></ion-icon>
        Iniciar sesión
      </ion-button>
    </form>

    <div class="sep"><div class="sep-line"></div><span>o continúa con</span><div class="sep-line"></div></div>

    <div class="social-row">
      <ion-button fill="outline" class="btn-social" (click)="onGoogleLogin()">
        <ion-icon name="logo-google" slot="start"></ion-icon>Google
      </ion-button>
      <ion-button fill="outline" class="btn-social" (click)="onFacebookLogin()">
        <ion-icon name="logo-facebook" slot="start"></ion-icon>Facebook
      </ion-button>
    </div>

    <p class="bottom-text">¿No tienes una cuenta? <a routerLink="/auth/register">Regístrate</a></p>
    <a routerLink="/auth/empresa-request" class="empresa-link">¿Eres empresa de transporte? Solicita acceso</a>

    <p class="version-text">Versión 1.0.0</p>
  </div>
</ion-content>
