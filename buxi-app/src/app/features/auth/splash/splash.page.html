<ion-content class="splash-content" [fullscreen]="true">
  <div class="splash-center">
    <div class="halo" #halo></div>

    <div class="lockup">
      <!-- El logo: la B de la marca es la B de «Buxci». Las tres franjas del
           asta entran desde la izquierda como líneas de velocidad, la panza
           cierra la B, «uxci» sube letra por letra (inclinada como la B) y al
           final la i transmite. Lo arma diseno/logo/logo_con_b.mjs: si cambia,
           las medidas salen de ahí. -->
      <svg class="logo" viewBox="0 -9.9 303.39 89.9" role="img" aria-label="Buxci">
        <defs>
          <mask id="splash-sin-palito" maskUnits="userSpaceOnUse" x="0" y="-9.9" width="303.39" height="89.9">
            <rect x="0" y="-9.9" width="303.39" height="89.9" fill="#fff" />
            <g transform="translate(-6 0) translate(22.58 0) skewX(-12)"><path d="M255.13 78V21H269.48V78Z" fill="#000" stroke="#000" stroke-width="7" stroke-linejoin="round" /></g>
          </mask>
        </defs>
        <g transform="translate(0 2) scale(0.63333)">
          <path class="franja" #franja d="M25.51 0L53.51 0L46.28 34L18.28 34Z" />
          <path class="franja" #franja d="M17 40L45 40L36.5 80L8.5 80Z" />
          <path class="franja" #franja d="M7.23 86L35.23 86L28 120L0 120Z" />
          <path class="panza" #panza d="M52.91 0L81.51 0C94.64 0 105.31 6.96 109.54 18.29C113.77 29.62 110.93 43.62 102.08 55.08C111.57 65.21 112.24 81.51 103.76 95.96C95.28 110.42 79.43 120 64 120L27.4 120L33.35 92L69.95 92C74.92 92 79.81 87.97 80.86 83C81.92 78.03 78.75 74 73.78 74L37.18 74L43.13 46L71.73 46C76.7 46 81.59 41.97 82.64 37C83.7 32.03 80.53 28 75.56 28L46.96 28Z" />
        </g>
        <!-- Las piezas que se animan no llevan transform propio: el estilo que
             les pone la animación lo pisaría. Por eso van dentro de grupos. -->
        <g transform="translate(22.58 0) skewX(-12)">
          <path class="letra" #letter d="M93.94 79.69Q87.24 79.69 83.02 77.42Q78.8 75.15 76.45 71.67Q74.1 68.18 73.1 64.41Q72.09 60.64 71.88 57.52Q71.67 54.41 71.67 52.98V21H86.24V47.92Q86.24 49.87 86.45 52.9Q86.66 55.94 87.77 59Q88.88 62.06 91.38 64.12Q93.89 66.18 98.48 66.18Q100.33 66.18 102.44 65.6Q104.55 65.02 106.4 63.35Q108.25 61.69 109.43 58.45Q110.62 55.2 110.62 49.92L118.86 53.83Q118.86 60.58 116.11 66.49Q113.37 72.41 107.85 76.05Q102.34 79.69 93.94 79.69ZM112.42 78V59.11H110.62V21H125.08V78Z" />
          <path class="letra" #letter d="M130.78 78 151.16 49.18 131.21 21H148.09L159.49 37.89L170.68 21H187.57L167.62 49.18L188.1 78H171.21L159.49 60.48L147.67 78Z" />
          <path class="letra" #letter d="M219.34 79.58Q210.48 79.58 204.14 75.62Q197.81 71.67 194.43 64.86Q191.06 58.05 191.06 49.5Q191.06 40.84 194.57 34.04Q198.07 27.23 204.46 23.32Q210.85 19.42 219.56 19.42Q229.64 19.42 236.47 24.51Q243.31 29.6 245.21 38.42L230.85 42.22Q229.58 37.78 226.44 35.3Q223.3 32.82 219.34 32.82Q214.81 32.82 211.9 35.01Q209 37.2 207.63 40.98Q206.26 44.75 206.26 49.5Q206.26 56.94 209.55 61.56Q212.85 66.18 219.34 66.18Q224.2 66.18 226.73 63.96Q229.27 61.74 230.53 57.63L245.21 60.69Q242.78 69.77 236.02 74.67Q229.27 79.58 219.34 79.58Z" />
          <path class="letra" #letter d="M255.13 78V21H269.48V78Z" />
        </g>
        <g transform="translate(6.00 0)">
          <g class="letra senal" #letter>
            <circle class="punto" cx="276.84" cy="9.65" r="7.2" />
            <!-- La máscara se lee en el sistema de este grupo (corrido por la señal):
                 por eso el palito de la máscara lleva el corrimiento al revés. -->
            <g mask="url(#splash-sin-palito)">
              <circle class="onda" cx="276.84" cy="9.65" r="11.6" />
              <circle class="onda onda2" cx="276.84" cy="9.65" r="16.8" />
            </g>
          </g>
        </g>
      </svg>

      <div class="tagline" #tagline>Tus buses en tiempo real</div>
    </div>
  </div>

  <!-- ====== ANUNCIO DE APERTURA ====== -->
  <div class="sponsor-overlay" *ngIf="sponsorAd" [class]="'anim-' + sponsorAd.animacion">
    <div class="sponsor-top">
      <span class="sponsor-label">Presentado por</span>
      <span class="sponsor-skip" [class.ready]="canSkipSponsor" (click)="skipSponsor()">
        <ng-container *ngIf="canSkipSponsor; else waiting">Continuar<ion-icon name="arrow-forward"></ion-icon></ng-container>
        <ng-template #waiting>· · ·</ng-template>
      </span>
    </div>

    <div class="sponsor-media" (click)="skipSponsor()">
      <video *ngIf="sponsorAd.media_tipo==='video'" [src]="sponsorAd.media_url" muted autoplay loop playsinline></video>
      <img *ngIf="sponsorAd.media_tipo==='imagen'" [src]="sponsorAd.media_url" alt="" />
      <div class="sponsor-badge">
        <img *ngIf="sponsorAd.logo_url" [src]="sponsorAd.logo_url" class="sponsor-logo" alt="" />
        <div class="sponsor-logo sponsor-logo-fallback" *ngIf="!sponsorAd.logo_url">{{ sponsorAd.titulo.charAt(0) }}</div>
        <div class="sponsor-name-block">
          <b>{{ sponsorAd.titulo }}</b>
          <span *ngIf="sponsorAd.descripcion">{{ sponsorAd.descripcion }}</span>
        </div>
      </div>
    </div>

    <a class="sponsor-cta" *ngIf="sponsorAd.link_url" [href]="sponsorAd.link_url" target="_blank" rel="noopener">Ver más</a>
  </div>
</ion-content>
