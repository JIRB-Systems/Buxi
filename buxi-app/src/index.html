<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="utf-8" />
  <title>Buxci - Tus buses en tiempo real</title>

  <base href="/" />

  <meta name="color-scheme" content="dark" />
  <meta name="theme-color" content="#0a1628" />
  <meta name="viewport" content="viewport-fit=cover, width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="format-detection" content="telephone=no" />
  <meta name="msapplication-tap-highlight" content="no" />

  <link rel="icon" type="image/png" href="assets/icon/buxci-favicon.png" />
  <link rel="manifest" href="manifest.webmanifest" />
  <!-- La fuente se pide junto con el HTML: sin esto el texto pinta primero en
       la fuente del sistema y salta al llegar Manrope. -->
  <link rel="preload" href="assets/fonts/manrope-latin-var.woff2" as="font" type="font/woff2" crossorigin />

  <!-- Agregar a la pantalla de inicio.
       iOS solo entra en pantalla completa con el meta de prefijo `apple-`:
       con el estándar `mobile-web-app-capable` a secas seguía abriendo con
       la barra de Safari encima. El título corto va aparte porque, si no,
       iOS usa el <title> y lo recorta ("Buxci-Tusbu…"), y el ícono hay que
       declararlo porque iOS no lee el del manifiesto. -->
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="Buxci" />
  <meta name="application-name" content="Buxci" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <link rel="apple-touch-icon" href="assets/icon/buxci-icon-180.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="assets/icon/buxci-icon-180.png" />
</head>

<body>
  <app-root></app-root>
</body>

</html>
