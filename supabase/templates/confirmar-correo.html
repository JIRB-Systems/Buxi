<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Confirmá tu correo</title>
</head>
<body style="margin:0;padding:0;background:#eef2f7;">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#eef2f7;padding:32px 16px;">
  <tr><td align="center">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:480px;background:#ffffff;border-radius:16px;overflow:hidden;font-family:Arial,Helvetica,sans-serif;">
      <tr><td style="background:#0a1628;padding:22px 28px;">
        <span style="font-size:24px;font-weight:800;color:#ffffff;letter-spacing:-0.5px;">Buxci</span><span style="color:#00c853;font-size:24px;font-weight:800;">.</span>
      </td></tr>
      <tr><td style="padding:32px 28px 8px;">
        <h1 style="margin:0 0 12px;font-size:22px;line-height:1.3;color:#0a1628;">Confirmá tu correo</h1>
        <p style="margin:0 0 24px;font-size:16px;line-height:1.55;color:#3d4a5c;">Tocá el botón para activar tu cuenta. Después entrás directo a la app.</p>
        <table role="presentation" cellpadding="0" cellspacing="0"><tr><td style="border-radius:999px;background:#00c853;">
          <a href="{{ .ConfirmationURL }}" style="display:inline-block;padding:14px 28px;font-size:16px;font-weight:700;color:#04140a;text-decoration:none;border-radius:999px;">Confirmar mi correo</a>
        </td></tr></table>
      </td></tr>
      <tr><td style="padding:24px 28px 28px;">
        <p style="margin:0;font-size:13px;line-height:1.5;color:#6b7788;">Si no creaste una cuenta en Buxci, ignorá este correo: no se va a activar nada.</p>
      </td></tr>
    </table>
  </td></tr>
</table>
</body>
</html>
